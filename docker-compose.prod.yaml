version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: prompify-postgres
    # Day 18 — continuous WAL archiving to the shared volume; the backup container uploads
    # segments to OBS. `archive_command = test+cp` returns in microseconds (never blocks
    # Postgres); `archive_timeout=300` bounds idle WAL growth to 5 minutes.
    # Rollback: remove this command block (Postgres reverts to internal checkpointing).
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /wal_archive/%f && cp %p /wal_archive/%f'
      -c archive_timeout=300
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prompify}
      POSTGRES_USER: ${POSTGRES_USER:-prompify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - wal_archive:/wal_archive
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - prompify-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prompify_user} -d ${POSTGRES_DB:-prompify}"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    profiles: ['production']

  # Redis for session storage (not yet used by application code —
  # present for future connection pooling / rate-limiting / caching)
  redis:
    image: redis:7-alpine
    container_name: prompify-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - prompify-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ['production']

  app:
    image: bolt-ai:production
    build:
      context: .
      # Day 14 — compiled Node server (verified Day 13 target). Vite is build-time only:
      # `remix vite:build` runs during image build; at runtime only `node server.js` runs.
      # Rollback: set target back to `bolt-ai-production` and command to `pnpm run dev --host`.
      target: bolt-ai-prod-node
    container_name: prompify-app
    env_file: '.env'
    environment:
      # Core
      - NODE_ENV=production
      - PORT=5173
      - RUNNING_IN_DOCKER=true
      - APP_URL=${APP_URL:-https://www.prompify.com}

      # Auth
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-true}

      # Database
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://${POSTGRES_USER:-prompify_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prompify}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379

      # Supabase (per-app databases)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

      # Email — Resend. FROM_EMAIL must be on a domain verified in the Resend account.
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@prompify.com}
      - FROM_NAME=${FROM_NAME:-Prompify}

      # AI Providers
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - TOGETHER_API_BASE_URL=${TOGETHER_API_BASE_URL}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DASHSCOPE_API_BASE_URL=${DASHSCOPE_API_BASE_URL}
      - OLLAMA_API_BASE_URL=${OLLAMA_API_BASE_URL}
      - AWS_BEDROCK_CONFIG=${AWS_BEDROCK_CONFIG}
      - HuggingFace_API_KEY=${HuggingFace_API_KEY}

      # GitHub
      - VITE_GITHUB_ACCESS_TOKEN=${VITE_GITHUB_ACCESS_TOKEN}
      - VITE_GITHUB_TOKEN_TYPE=${VITE_GITHUB_TOKEN_TYPE:-classic}

      # KooGallery
      - KOOGALLERY_ACCESS_KEY=${KOOGALLERY_ACCESS_KEY}
      - KOOGALLERY_ACCESS_ID=${KOOGALLERY_ACCESS_ID}
      - KOOGALLERY_API_BASE_URL=${KOOGALLERY_API_BASE_URL:-https://api.koogallery.com}
      - KOOGALLERY_ENABLED=${KOOGALLERY_ENABLED:-false}
      - CRON_SECRET=${CRON_SECRET}

      # Snapshots
      - SNAPSHOTS_ENABLED=${SNAPSHOTS_ENABLED:-true}

      # Data API
      - DATA_API_SECRET=${DATA_API_SECRET}

      # Additional AI providers (passthrough from .env)
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - HYPERBOLIC_API_KEY=${HYPERBOLIC_API_KEY}
      - HYPERBOLIC_API_BASE_URL=${HYPERBOLIC_API_BASE_URL}
      - LMSTUDIO_API_BASE_URL=${LMSTUDIO_API_BASE_URL}
      - OPENAI_LIKE_API_BASE_URL=${OPENAI_LIKE_API_BASE_URL}
      - OPENAI_LIKE_API_KEY=${OPENAI_LIKE_API_KEY}

      # Logging
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-info}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}

    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - /root/qa/ssl:/app/ssl:ro
    ports:
      - '127.0.0.1:5173:5173'
    networks:
      - prompify-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: node server.js
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5173/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    profiles: ['production']

  # Day 18 — three-layer database backups (WAL 60s -> OBS, pg_dump daily, pg_basebackup
  # weekly) with retention. Same image as postgres (ships pg_dump/pg_basebackup/psql).
  # If this container dies, WAL segments accumulate harmlessly on the shared volume.
  backup:
    image: postgres:15-alpine
    container_name: prompify-backup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-prompify_user}
      POSTGRES_DB: ${POSTGRES_DB:-prompify}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - wal_archive:/wal_archive
      - ./scripts/backup-runner.sh:/backup-runner.sh:ro
    entrypoint: >
      /bin/sh -c "
        apk add --no-cache aws-cli > /dev/null 2>&1 &&
        echo '[backup] Container started' &&
        sh /backup-runner.sh
      "
    networks:
      - prompify-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ['production']

  # Cron — sleeps inactive container apps every 15 minutes; nightly snapshot GC at ~03:30 UTC;
  # inactivity win-back mail at ~04:45 UTC.
  # GC runs DRY-RUN by default: switch to '/api/cron/gc?apply=true' ONLY after the Day 18
  # restore test has passed (backups are the recovery path for GC mistakes).
  # inactivity also runs DRY-RUN by default: it mails real customers, so add '?apply=true' only
  # once the Resend domain is verified and the dry-run address list looks right.
  cron:
    image: curlimages/curl:latest
    container_name: prompify-cron
    environment:
      - CRON_SECRET=${CRON_SECRET}
    networks:
      - prompify-network
    depends_on:
      - app
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "
        while true; do
          sleep 900;
          curl -s -X POST http://app:5173/api/cron/sleep-check -H \"Authorization: Bearer $$CRON_SECRET\" -H \"Content-Type: application/json\";
          H=$$(date -u +%H); M=$$(date -u +%M);
          if [ \"$$H\" = \"03\" ] && [ \"$$M\" -ge 30 ] && [ \"$$M\" -lt 45 ]; then
            curl -s -X POST \"http://app:5173/api/cron/gc\" -H \"Authorization: Bearer $$CRON_SECRET\" -H \"Content-Type: application/json\";
          fi;
          if [ \"$$H\" = \"04\" ] && [ \"$$M\" -ge 45 ]; then
            curl -s -X POST \"http://app:5173/api/cron/inactivity\" -H \"Authorization: Bearer $$CRON_SECRET\" -H \"Content-Type: application/json\";
          fi;
        done
      "
    profiles: ['production']

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: prompify-nginx
    volumes:
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      - ./ssl_prompifycom:/etc/nginx/ssl_prompifycom:ro
      - /etc/nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - prompify-network
    depends_on:
      - app
    restart: unless-stopped
    profiles: ['production']

  # Certbot — auto-renews SSL certificates
  certbot:
    image: certbot/certbot:latest
    container_name: prompify-certbot-dev
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-log:/var/log/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - prompify-network
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    profiles: ['production']

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # Day 18 — WAL staging area shared between postgres (writes segments) and backup (uploads
  # to OBS then deletes). If backup is down, segments accumulate here without affecting PG.
  wal_archive:
    driver: local
  certbot-etc:
    driver: local
  certbot-var:
    driver: local
  certbot-log:
    driver: local
  certbot-webroot:
    driver: local

networks:
  prompify-network:
    driver: bridge
