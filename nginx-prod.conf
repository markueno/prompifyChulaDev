# This file is mounted over /etc/nginx/nginx.conf, which REPLACES nginx's shipped config —
# including its `worker_processes auto`. Without this line the built-in default of 1 applies,
# so every TLS handshake and proxied request for the whole site runs on a single core.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Gzip compression (lower min_length for better compression of small chunks)
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    # text/html is always gzipped by nginx and must not be listed. SVG and WASM are both plain
    # text on the wire and compress well; they were previously served raw.
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/xml+rss application/json image/svg+xml application/wasm
               application/manifest+json;
    gzip_proxied any;
    gzip_comp_level 5;

    # Security: Hide nginx version and server information
    server_tokens off;
    
    # Additional security headers (applied globally)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    upstream app {
        server app:5173;
    }

    # HTTP server - handles ACME challenges for certbot
    server {
        listen 80;
        server_name _;
        
        # Allow Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }
        
        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        # HTTP/2: multiplexes all requests over one connection. Without it the browser is held
        # to ~6 parallel connections with head-of-line blocking, which is barely noticeable on a
        # local network and severe for distant/VPN users — the client build is split across
        # hundreds of chunk files. Requires nginx >= 1.25.1 (the `nginx:alpine` tag is well past
        # that); on older nginx the equivalent is `listen 443 ssl http2;`.
        http2 on;
        server_name _;

        # SSL configuration - Let's Encrypt certificates (certbot)
        # Certbot stores certificates at /etc/letsencrypt/live/prompify.com/
        ssl_certificate /etc/letsencrypt/live/prompify.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/prompify.com/privkey.pem;
        
        # Fallback to manual certificates (uncomment if not using certbot):
        # ssl_certificate /etc/nginx/ssl_prompifycom/cert.pem;
        # ssl_certificate_key /etc/nginx/ssl_prompifycom/key.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_dhparam /etc/nginx/dhparam.pem;

        # OCSP stapling (avoids external OCSP query on every TLS handshake)
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # HSTS — force HTTPS on repeat visits (2 years, all subdomains)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # WebContainer security headers (COEP/COOP/CORP) are set by the app itself
        # (server.js on every response; entry.server.tsx on documents). Do NOT add_header
        # them here: nginx add_header APPENDS, producing duplicate headers, and browsers
        # parse a duplicated COEP/COOP as invalid -> policy falls back to unsafe-none ->
        # crossOriginIsolated=false -> WebContainer/SharedArrayBuffer dead behind the proxy.
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Client max body size (for file uploads)
        client_max_body_size 100M;

        # KooGallery SaaS 2.0 Main Endpoint (recommended)
        location /saasproduce {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # KooGallery specific headers
            proxy_set_header Content-Type application/json;
            proxy_set_header Accept application/json;
            
            # Increase timeout for KooGallery requests
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            
            # Allow large request bodies for complex operations
            client_max_body_size 10M;
        }

        # Security: Block access to sensitive directories and files
        location ~ /\.(git|svn|hg|bzr) {
            deny all;
            return 404;
        }
        
        location ~ /\.(env|config|secret|htaccess|htpasswd|DS_Store) {
            deny all;
            return 404;
        }
        
        # Block access to lock files (but allow package.json for version checking)
        location ~ /(yarn\.lock|pnpm-lock\.yaml|composer\.json|composer\.lock)$ {
            deny all;
            return 404;
        }
        
        # Block access to backup and temporary files
        location ~ /\.(bak|backup|old|tmp|temp)$ {
            deny all;
            return 404;
        }
        
        # Block access to log files
        location ~ /\.(log|logs)$ {
            deny all;
            return 404;
        }

        # Data proxy API (/api/data/*): the app is the SOLE CORS authority — it reflects the
        # exact WebContainer preview origin, allows the Authorization header + all methods, and
        # answers the OPTIONS preflight (incl. Private Network Access). The `location /` block
        # below adds `Access-Control-Allow-Origin *` to every response; if these routes go there
        # too, the response carries TWO Access-Control-Allow-Origin values ("<origin>, *"), which
        # browsers reject — the fetch fails even though the server returns 200. So proxy these
        # cleanly with NO CORS add_header and NO OPTIONS short-circuit. `^~` stops the regex
        # locations below from matching.
        location ^~ /api/data/ {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_http_version 1.1;
            proxy_read_timeout 86400;
        }

        # Main proxy location
        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # WebSocket support - CRITICAL for WebContainers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            
            # CORS for WebContainer resources
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' '*' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                return 204;
            }
            
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # WebContainer static resources: COEP/COOP/CORP come from the app (server.js sets
        # them on every response) — adding them here would DUPLICATE the headers and break
        # cross-origin isolation (browsers parse duplicated COEP/COOP as unsafe-none).
        location ~ \.(js|css|wasm)$ {
            proxy_pass http://app;
            proxy_set_header Host $host;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # Static files caching (images, fonts, etc.)
        #
        # NOT `immutable`: these filenames carry no content hash (`background1.jpeg`), so
        # `immutable` for a year meant a browser would never re-request them and an updated
        # image could never reach a returning visitor. Fingerprinted assets under /assets/ are
        # a different matter — server.js marks those immutable itself, correctly.
        #
        # A week with revalidation keeps them effectively free on repeat visits while leaving a
        # way to ship a change.
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://app;
            proxy_set_header Host $host;

            # server.js already sends `Cache-Control: public, max-age=3600` for everything
            # outside /assets/. add_header APPENDS rather than replaces, so without hiding the
            # upstream value the response would carry two conflicting Cache-Control headers —
            # the same duplicate-header trap documented above for COEP/COOP.
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        }
    }
}

