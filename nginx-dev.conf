events {
    worker_connections 1024;
}

http {
    # Security: Hide nginx version and server information
    server_tokens off;
    
    # Additional security headers (applied globally)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    upstream app {
        server app:5173;
    }

    # HTTP server (no SSL - for dev/QA without certificates)
    server {
        listen 80;
        server_name _;

        # COEP/COOP/CORP are set by the app itself (entry.server.tsx on documents; server.js
        # on everything in prod). Do NOT add_header them here — nginx APPENDS, and duplicated
        # COEP/COOP headers parse as invalid in browsers -> unsafe-none ->
        # crossOriginIsolated=false -> WebContainer/SharedArrayBuffer dead behind the proxy.

        # # KooGallery SaaS 2.0 API endpoints (legacy individual endpoints)
        # location /api/koogallery/ {
        #     proxy_pass http://app;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
            
        #     # KooGallery specific headers
        #     proxy_set_header Content-Type application/json;
        #     proxy_set_header Accept application/json;
            
        #     # Increase timeout for KooGallery requests (upgrades can take longer)
        #     proxy_read_timeout 600s;
        #     proxy_connect_timeout 60s;
        #     proxy_send_timeout 600s;
            
        #     # Allow large request bodies for complex operations
        #     client_max_body_size 10M;
        # }

        # KooGallery SaaS 2.0 Main Endpoint (recommended)
        location /saasproduce {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # KooGallery specific headers
            proxy_set_header Content-Type application/json;
            proxy_set_header Accept application/json;
            
            # Increase timeout for KooGallery requests
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            
            # Allow large request bodies for complex operations
            client_max_body_size 10M;
        }

        # Security: Block access to version control files and sensitive directories
        location ~ /\.(git|env|htaccess|htpasswd) {
            deny all;
            return 404;
        }
        
        location ~ /\.(env|config|secret) {
            deny all;
            return 404;
        }
        
        # Block access to lock files (but allow package.json for version checking)
        location ~ /(yarn\.lock|pnpm-lock\.yaml|composer\.json|composer\.lock)$ {
            deny all;
            return 404;
        }

        # Data proxy API (/api/data/*): the app is the SOLE CORS authority (reflects the exact
        # WebContainer origin + handles the preflight). `location /` below adds
        # `Access-Control-Allow-Origin *` to every response; routing these there too yields TWO
        # Access-Control-Allow-Origin values ("<origin>, *"), which browsers reject. Proxy these
        # cleanly with NO CORS add_header and NO OPTIONS short-circuit.
        location ^~ /api/data/ {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 86400;
        }

        # Main proxy location
        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support - CRITICAL for WebContainers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            
            # CORS for WebContainer resources
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' '*' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                return 204;
            }
            
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # WebContainer static resources: COEP/COOP/CORP come from the app (server.js or
        # entry.server.tsx). Do NOT add_header them here — duplicates break cross-origin
        # isolation with unsafe-none fallback.
        location ~ \.(js|css|wasm)$ {
            proxy_pass http://app;
            proxy_set_header Host $host;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }
    }
}

